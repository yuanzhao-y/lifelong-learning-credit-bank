services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.33}
    container_name: llcb-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: llcb
      MYSQL_USER: llcb
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ullcb -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7.2.4}
    container_name: llcb-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llcb-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      MYSQL_URL: jdbc:mysql://mysql:3306/llcb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USER: llcb
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATA_CRYPTO_SECRET: ${DATA_CRYPTO_SECRET:?DATA_CRYPTO_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:3000}
      EXPOSE_DEV_SMS_CODE: ${EXPOSE_DEV_SMS_CODE:-false}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20971520}
      TOS_REGION: cn-beijing
      TOS_ENDPOINT: https://tos-cn-beijing.volces.com
      TOS_BUCKET: zhousheng1
      TOS_BUCKET_DOMAIN: https://zhousheng1.tos-cn-beijing.volces.com
      TOS_PREFIX: llcb/
      TOS_ACCESS_KEY_FILE: /run/secrets/tos_access_key
    volumes:
      - ${TOS_ACCESS_KEY_FILE:-./AccessKey.txt}:/run/secrets/tos_access_key:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.25.5}
    container_name: llcb-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  jenkins:
    image: ${JENKINS_IMAGE:-jenkins/jenkins:2.541.3-lts-jdk17}
    container_name: llcb-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8081}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home

volumes:
  mysql-data:
  redis-data:
  jenkins-home:
