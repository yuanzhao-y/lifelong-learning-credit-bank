services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.33}
    container_name: llcb-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: llcb
      MYSQL_USER: llcb
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-llcb123456}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ullcb -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7.2.4}
    container_name: llcb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--bind", "0.0.0.0", "--protected-mode", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llcb-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      MYSQL_URL: jdbc:mysql://mysql:3306/llcb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USER: llcb
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-llcb123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-llcb-docker-secret-change-me-please-32bytes}
      DATA_CRYPTO_SECRET: ${DATA_CRYPTO_SECRET:-llcb-docker-data-crypto-key}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      TOS_REGION: cn-beijing
      TOS_ENDPOINT: https://tos-cn-beijing.volces.com
      TOS_BUCKET: zhousheng1
      TOS_BUCKET_DOMAIN: https://zhousheng1.tos-cn-beijing.volces.com
      TOS_PREFIX: llcb/
      TOS_ACCESS_KEY_FILE: /run/secrets/tos_access_key
    volumes:
      - ${TOS_ACCESS_KEY_FILE:-C:/Users/zhous/Desktop/develop/tos/AccessKey.txt}:/run/secrets/tos_access_key:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.25.5}
    container_name: llcb-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  jenkins:
    image: ${JENKINS_IMAGE:-jenkins/jenkins:2.440.1-lts-jdk17}
    container_name: llcb-jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_PORT:-8081}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins-home:/var/jenkins_home

volumes:
  mysql-data:
  redis-data:
  jenkins-home:
