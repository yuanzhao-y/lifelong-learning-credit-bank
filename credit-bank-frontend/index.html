<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="description" content="终身学习学分银行 - 记录每一次成长，让学习更有价值" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <title>终身学习学分银行</title>
  <style>
    body { margin: 0; background: #0a0e1a; }
    #app-loader { display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0e1a; }
    .loader-spinner { width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div id="app-loader"><div class="loader-spinner"></div></div>
  </div>
